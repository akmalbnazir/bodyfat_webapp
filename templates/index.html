<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Body Fat Estimator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional: Customize Tailwind config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0f766e',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-3xl bg-white rounded-xl shadow-md p-8">
        <h1 class="text-3xl font-bold text-center text-brand mb-6">📸 AI Body Fat Estimator</h1>

        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block font-medium">Upload Image (Full Torso)</label>
                <input type="file" name="image" accept="image/*" required
                       class="mt-1 w-full border border-gray-300 p-2 rounded" onchange="previewImage(event)">
                <img id="preview" class="mt-4 max-h-64 rounded shadow" style="display: none;">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-medium">Height (cm)</label>
                    <input type="number" name="height" required class="w-full border border-gray-300 p-2 rounded">
                </div>
                <div>
                    <label class="block font-medium">Weight (kg)</label>
                    <input type="number" name="weight" required class="w-full border border-gray-300 p-2 rounded">
                </div>
                <div>
                    <label class="block font-medium">Age</label>
                    <input type="number" name="age" required class="w-full border border-gray-300 p-2 rounded">
                </div>
                <div>
                    <label class="block font-medium">Gender</label>
                    <select name="gender" class="w-full border border-gray-300 p-2 rounded" required>
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>

            <div class="text-center pt-4">
                <button type="submit"
                        class="bg-brand text-white px-6 py-2 rounded hover:bg-emerald-700 transition">
                    Analyze
                </button>
            </div>
        </form>

        {% if result %}
            <div class="mt-8 border-t pt-6">
                <h2 class="text-2xl font-semibold mb-4 text-brand">📊 Analysis Result</h2>
                <div class="prose max-w-none bg-gray-50 p-4 rounded border border-gray-300 overflow-auto">
                    {% if is_html %}
                        {{ result | safe }}
                    {% else %}
                        <pre>{{ result }}</pre>
                    {% endif %}
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        function previewImage(event) {
            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(event.target.files[0]);
            img.style.display = 'block';
        }
    </script>
</body>
</html>
